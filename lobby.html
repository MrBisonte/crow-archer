<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CROW ARCHER — Lobby</title>
  <style>
    body { margin: 0; padding: 0; background: #0a0f0a; overflow: hidden; }
    canvas { display: block; cursor: crosshair; image-rendering: pixelated; }
  </style>
</head>
<body>
  <canvas id="canvas" width="1056" height="704"></canvas>
  <script type="module">
    import { WsTransport } from './src/net/ws-transport.js';
    import { LobbyController } from './src/ui/lobby-controller.js';

    const canvas = document.getElementById('canvas');

    // Server URL: try localhost:8082 by default, or use ?server=ws://...
    const params = new URLSearchParams(location.search);
    const serverUrl = params.get('server') || 'ws://127.0.0.1:8082';

    console.log(`Connecting to lobby server: ${serverUrl}`);

    async function main() {
      const transport = new WsTransport({ url: serverUrl, handshakeTimeoutMs: 10000 });
      const controller = new LobbyController({ transport, canvas });

      try {
        console.log('Connecting...');
        await transport.connect();
        console.log('Connected!');
      } catch (e) {
        console.error('Failed to connect:', e.message);
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#0a0f0a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff1f1f';
        ctx.font = '24px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('CONNECTION FAILED', canvas.width / 2, canvas.height / 2);
        ctx.font = '16px monospace';
        ctx.fillText(`${serverUrl}`, canvas.width / 2, canvas.height / 2 + 50);
        return;
      }

      // Game loop
      function frame() {
        controller.frame();
        requestAnimationFrame(frame);
      }

      // Input
      document.addEventListener('keydown', (e) => {
        if (controller.handleKey(e.key)) e.preventDefault();
      });

      frame();
    }

    main().catch(console.error);
  </script>
</body>
</html>
